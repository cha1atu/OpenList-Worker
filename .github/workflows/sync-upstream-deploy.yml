name: Sync upstream and deploy

# Keep this fork current with OpenListTeam/OpenList-Worker, then publish
# https://openlist.f1nd.fun. Secrets already on the Worker are left in place.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: sync
        run: |
          git remote add upstream https://github.com/OpenListTeam/OpenList-Worker.git
          git fetch upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          git merge upstream/main --no-edit
          after=$(git rev-parse HEAD)
          if [ "$before" != "$after" ]; then
            git push origin HEAD:main
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install, overlay, and deploy
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENLIST_HOSTNAME: openlist.f1nd.fun
        run: |
          pnpm install --no-frozen-lockfile
          node scripts/apply-cf-overlay.mjs
          node scripts/fetch-frontend.mjs
          pnpm exec wrangler deploy
